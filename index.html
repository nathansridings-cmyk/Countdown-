<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Countdown"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>14 Day Countdown</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:clamp(1.5rem,5vw,3.5rem);margin:0 0 .5em;color:#9ecbff;font-weight:600}
.grid{display:flex;gap:clamp(.5rem,3vw,2rem);flex-wrap:wrap;justify-content:center}
.box{background:#16223a;border-radius:18px;padding:clamp(.8rem,3vw,2rem);min-width:clamp(70px,18vw,200px)}
.num{font-size:clamp(2.5rem,12vw,9rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.lbl{margin-top:.4em;font-size:clamp(.8rem,2.5vw,1.4rem);color:#9aa8c0;text-transform:uppercase;letter-spacing:.1em}
.end{margin-top:1.5em;color:#9aa8c0;font-size:clamp(.9rem,2.5vw,1.3rem)}
.done{font-size:clamp(2.5rem,10vw,7rem);color:#7dffa8;font-weight:700}
</style></head><body>
<h1 id="title">14 Day Countdown</h1>
<div class="grid" id="grid">
<div class="box"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
<div class="box"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
<div class="box"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
<div class="box"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
</div>
<div class="end" id="end"></div>
<script>
// Default end: Oct 14, 2026 11:40 PM Eastern. Override with ?end=2026-10-14T23:40:00-04:00&title=My+Event
const p=new URLSearchParams(location.search);
const end=new Date(p.get('end')||'2026-10-14T23:40:00-04:00');
if(p.get('title'))document.getElementById('title').textContent=p.get('title');
document.getElementById('end').textContent='Ends '+end.toLocaleString([], {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'});
const pad=n=>String(n).padStart(2,'0');
function tick(){let t=Math.max(0,end-new Date());
if(t===0){document.getElementById('grid').innerHTML='<div class="done">Time\'s up! 🎉</div>';return;}
const s=Math.floor(t/1000);
document.getElementById('d').textContent=Math.floor(s/86400);
document.getElementById('h').textContent=pad(Math.floor(s%86400/3600));
document.getElementById('m').textContent=pad(Math.floor(s%3600/60));
document.getElementById('s').textContent=pad(s%60);
setTimeout(tick,1000-(Date.now()%1000));}
tick();
</script></body></html>
